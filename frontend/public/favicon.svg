    <!-- Main White Architectural 'A' Frame with Chamfered Apex -->
    <path 
      d="M64 22 C67.5 22 70.5 24 72.5 27.5 L108 89 C110.5 93.5 107.5 99 102 99 H83 C80 99 77.5 97.5 76 95 L64 74 L52 95 C50.5 97.5 48 99 45 99 H26 C20.5 99 17.5 93.5 20 89 L55.5 27.5 C57.5 24 60.5 22 64 22 Z" 
